name: Build IoskeleyMapleMono
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3 python3-pip jq unzip curl git

      - name: Download IoskeleyMono‑NerdFont
        run: |
          mkdir -p ioskeley
          cd ioskeley
          curl -s https://api.github.com/repos/ahatem/IoskeleyMono/releases/latest > meta.json
          URL=$(jq -r '.assets | map(select(.name == "IoskeleyMono-NerdFont.zip"))[0].browser_download_url' meta.json)
          echo "Ioskeley download URL: $URL"
          wget "$URL" -O ioskeley.zip
          unzip -q ioskeley.zip
          ls -la *.ttf

      - name: Clone maple‑font v7.9 source code
        run: |
          git clone --depth 1 --branch v7.9 https://github.com/subframe7536/maple-font.git maple-font-src
          cd maple-font-src
          pip3 install -r requirements.txt

      - name: Build MapleMono CN (normal width)
        run: |
          cd maple-font-src
          python3 build.py --cn --nf-mono --ttf-only --output ../maple_cn

      - name: Build MapleMono CN‑Narrow
        run: |
          cd maple-font-src
          python3 build.py --cn --cn-narrow --nf-mono --ttf-only --output ../maple_cn_narrow

      - name: Prepare output folders
        run: mkdir -p out/base out/nl out/nr

      - name: Batch‑fuse all weights
        run: |
          for ttf in ./ioskeley/*.ttf; do
            [ -f "$ttf" ] || continue
            fn=$(basename "$ttf")
            suffix="${fn#IoskeleyMonoNerdFont-}"
            fontforge -script fuse_fonts.ff "$ttf" ./maple_cn/ttf/MapleMono-CN-${suffix} ./out/base/IoskeleyMapleMono-${suffix}
            fontforge -script fuse_fonts.ff "$ttf" ./maple_cn_narrow/ttf/MapleMono-CN-${suffix} ./out/nr/IoskeleyMapleMono-NR-${suffix}
          done

      - name: Generate No‑Ligatures NL
        run: python3 strip_ligas.py ./out/base ./out/nl

      - name: Zip artifacts
        run: zip -r IoskeleyMapleMono.zip out

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: font-artifact
          path: IoskeleyMapleMono.zip
