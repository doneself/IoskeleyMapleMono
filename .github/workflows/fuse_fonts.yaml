name: Fuse Fonts
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  IOSKELEY_GIT_URL: ${{ github.server_url }}/ahatem/IoskeleyMono.git
  IOSKELEY_LATEST_RELEASE_API_URL: ${{ github.api_url }}/repos/ahatem/IoskeleyMono/releases/latest
  IOSKELEY_COPYRIGHT: Copyright 2020 The Ioskeley Mono Project Authors (${{ github.server_url }}/ahatem/IoskeleyMono)
  MAPLE_GIT_URL: ${{ github.server_url }}/subframe7536/maple-font.git
  MAPLE_LATEST_RELEASE_API_URL: ${{ github.api_url }}/repos/subframe7536/maple-font/releases/latest
  MAPLE_COPYRIGHT: Copyright 2022 The Maple Mono Project Authors (${{ github.server_url }}/subframe7536/maple-font)
  FUSION_NAME: Ioskeley Maple Mono
  FUSION_ID: IoskeleyMapleMono
  FUSION_DESCRIPTION: The free and open‑source font fused with Ioskeley Mono & Maple Mono
  FUSION_DEVELOPER: Space Time
  FUSION_URL: ${{ github.server_url }}/${{ github.repository }}
  FUSION_COPYRIGHT: Copyright 2025 Space Time (${{ github.server_url }}/${{ github.repository }})
  FUSION_LICENSE: "This Font Software is licensed under the SIL Open Font License, Version 1.1. This license is available with a FAQ at: https://openfontlicense.org"

jobs:
  fuse-fonts:
    name: Fuse Fonts
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Python Script & OFL License
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            fuse_fonts.ff
            strip_ligas.py
            OFL.txt

      - name: Fetch latest version tag
        id: versions
        run: |
          IOSKELEY_LATEST_VERSION="$(curl -s "$IOSKELEY_LATEST_RELEASE_API_URL" | jq -r ".tag_name")"
          MAPLE_LATEST_VERSION="$(curl -s "$MAPLE_LATEST_RELEASE_API_URL" | jq -r ".tag_name")"
          echo "IOSKELEY_LATEST_VERSION=$IOSKELEY_LATEST_VERSION" >> $GITHUB_ENV
          echo "MAPLE_LATEST_VERSION=$MAPLE_LATEST_VERSION" >> $GITHUB_ENV
          FUSION_VERSION="1.$(tr -d "." <<< "${IOSKELEY_LATEST_VERSION//v/}").$(tr -d "." <<< "${MAPLE_LATEST_VERSION//v/}")"
          echo "FUSION_VERSION=$FUSION_VERSION" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
          check-latest: true

      - name: Build Ioskeley Base
        run: |
          git clone --branch "$IOSKELEY_LATEST_VERSION" --single-branch "$IOSKELEY_GIT_URL"
          cd "IoskeleyMono"
          pip install -r "requirements.txt"
          gftools builder "sources/config.yaml"
          cd ..
          mkdir -p "source‑fonts/jetbrains"
          cp -r "IoskeleyMono/fonts/ttf/"* "source‑fonts/jetbrains/"

      - name: Install FontForge & FtCli
        run: |
          sudo apt‑get -y install fontforge
          pip install foundrytools‑cli

      - name: Build & Fuse All Variants
        run: |
          variants=(
            "NF|--nerd-font|XX"
            "NF|--nerd-font|NL"
            "XX|--no-nerd-font|XX"
            "XX|--no-nerd-font|NL"
            "NF|--nerd-font|XX|NR|--cn-narrow"
            "NF|--nerd-font|NL|NR|--cn-narrow"
            "XX|--no-nerd-font|XX|NR|--cn-narrow"
            "XX|--no-nerd-font|NL|NR|--cn-narrow"
          )
          
          for opt in "${variants[@]}"; do
            IFS='|' read -r NERD_SUFFIX NERD_ARGS LIGA_SUFFIX NARROW_SUFFIX NARROW_ARGS <<< "$opt"
            
            echo "==== Build: NERD=$NERD_SUFFIX NARROW=$NARROW_SUFFIX LIGA=$LIGA_SUFFIX ===="
            
            git clone --branch "$MAPLE_LATEST_VERSION" --single-branch "$MAPLE_GIT_URL" maple‑tmp
            cd maple‑tmp
            pip install -r "requirements.txt"
            python "build.py" --normal --liga --cn --hinted --ttf‑only $NERD_ARGS $NARROW_ARGS
            cd ..
            mkdir -p "source‑fonts/maple"
            if [[ "$NERD_SUFFIX" == "NF" ]]; then
              cp -r "maple‑tmp/fonts/NF‑CN/"* "source‑fonts/maple/"
            else
              cp -r "maple‑tmp/fonts/CN/"* "source‑fonts/maple/"
            fi

            mkdir -p "fused‑fonts‑HT"
            mkdir -p "fused‑fonts‑XX"

            for STYLE in "Thin" "ThinItalic" "ExtraLight" "ExtraLightItalic" "Light" "LightItalic" "Regular" "Italic" "Medium" "MediumItalic" "SemiBold" "SemiBoldItalic" "Bold" "BoldItalic" "ExtraBold" "ExtraBoldItalic"; do
              if [[ "$NERD_SUFFIX" == "NF" ]]; then
                fontforge "fuse_fonts.ff" \
                  "source‑fonts/maple/MapleMonoNormal‑NF‑CN‑$STYLE.ttf" \
                  "source‑fonts/jetbrains/IoskeleyMono‑$STYLE.ttf" \
                  "$FUSION_ID‑$STYLE" \
                  "$FUSION_NAME" \
                  "$FUSION_NAME $STYLE" \
                  "$STYLE" \
                  "fused‑font‑HT.ttf"
              else
                fontforge "fuse_fonts.ff" \
                  "source‑fonts/maple/MapleMonoNormal‑CN‑$STYLE.ttf" \
                  "source‑fonts/jetbrains/IoskeleyMono‑$STYLE.ttf" \
                  "$FUSION_ID‑$STYLE" \
                  "$FUSION_NAME" \
                  "$FUSION_NAME $STYLE" \
                  "$STYLE" \
                  "fused‑font‑HT.ttf"
              fi

              if [[ "$LIGA_SUFFIX" == "NL" ]]; then
                fontforge -script "strip_ligas.py" "fused‑font‑HT.ttf"
              fi

              ttx "fused‑font‑HT.ttf"
              sed -i "s|<xAvgCharWidth value=\".*\"/>|<xAvgCharWidth value=\"600\"/>|" "fused‑font‑HT.ttx"
              sed -i "s|<ulCodePageRange1 value=\".*\"/>|<ulCodePageRange1 value=\"00100000 00010110 00000001 10011111\"/>|" "fused‑font‑HT.ttx"
              ttx -o "fused‑font‑HT.ttf" "fused‑font‑HT.ttx"
              rm "fused‑font‑HT.ttx"

              gftools rename‑font "fused‑font‑HT.ttf" "$FUSION_NAME"
              gftools update‑nameids "fused‑font‑HT.ttf" \
                --uniqueid "$FUSION_ID‑$STYLE‑$FUSION_VERSION" \
                --description "$FUSION_DESCRIPTION" \
                --designer "$FUSION_DEVELOPER" \
                --manufacturer "$FUSION_DEVELOPER" \
                --trademark "$FUSION_NAME" \
                --version "$FUSION_VERSION" \
                --copyright "$(echo -e "$IOSKELEY_COPYRIGHT\n$MAPLE_COPYRIGHT\n$FUSION_COPYRIGHT")" \
                --license "$FUSION_LICENSE" \
                --urlvendor "$FUSION_URL" \
                --urldesigner "https://github.com/ahatem/IoskeleyMono" \
                --urllicense "https://openfontlicense.org"

              gftools drop‑hints "fused‑font‑HT.ttf" "fused‑font‑XX.ttf"

              if [[ -z "$NARROW_ARGS" ]]; then
                ftcli fix monospace "fused‑font‑HT.ttf"
                ftcli fix monospace "fused‑font‑XX.ttf"
              fi

              mv "fused‑font‑HT.ttf" "fused‑fonts‑HT/$FUSION_ID‑$STYLE.ttf"
              mv "fused‑font‑XX.ttf" "fused‑fonts‑XX/$FUSION_ID‑$STYLE.ttf"
            done

            zip -r "${FUSION_ID}-${NERD_SUFFIX}-${NARROW_SUFFIX:-XX}-${LIGA_SUFFIX}-HT.zip" "fused‑fonts‑HT"
            zip -r "${FUSION_ID}-${NERD_SUFFIX}-${NARROW_SUFFIX:-XX}-${LIGA_SUFFIX}-XX.zip" "fused‑fonts‑XX"
            
            rm -rf maple‑tmp source‑fonts/maple fused‑fonts‑HT fused‑fonts‑XX
          done

      - name: Release Fonts
        uses: softprops/action‑gh‑release@v2
        with:
          files: "*.zip"
          tag_name: ${{ env.FUSION_VERSION }}
          name: ${{ env.FUSION_VERSION }}
          body: >
            Fused with
            [Ioskeley Mono ${{ env.IOSKELEY_LATEST_VERSION }}](${{ github.server_url }}/ahatem/IoskeleyMono/releases/tag/${{ env.IOSKELEY_LATEST_VERSION }}) &
            [Maple Mono ${{ env.MAPLE_LATEST_VERSION }}](${{ github.server_url }}/subframe7536/maple‑font/releases/tag/${{ env.MAPLE_LATEST_VERSION }})
            Built with
            [Github Workflow #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: false
          make_latest: true
