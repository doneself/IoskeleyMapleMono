name: Build IoskeleyMapleMono
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3 jq unzip curl

      - name: Download IoskeleyMono-NerdFont
        run: |
          mkdir -p ioskeley
          cd ioskeley
          curl -s https://api.github.com/repos/ahatem/IoskeleyMono/releases/latest > meta.json
          URL=$(jq -r '.assets | map(select(.name == "IoskeleyMono-NerdFont.zip"))[0].browser_download_url' meta.json)
          echo "Ioskeley URL: $URL"
          wget "$URL" -O ioskeley.zip
          unzip -q ioskeley.zip

      - name: Download MapleMono-CN (v7.9 fixed tag)
        run: |
          mkdir -p maple
          cd maple
          curl -s https://api.github.com/repos/subframe7536/maple-font/releases/tags/v7.9 > meta.json
          URL=$(jq -r '.assets[] | select(.name=="MapleMono-CN.zip") | .browser_download_url' meta.json)
          wget "$URL" -O maple.zip
          unzip -q maple.zip

      - name: Download MapleMono-CN-Narrow
        run: |
          cd maple
          curl -s https://api.github.com/repos/subframe7536/maple-font/releases/tags/v7.9 > meta.json
          URL=$(jq -r '.assets[] | select(.name=="MapleMono-CN-Narrow.zip") | .browser_download_url' meta.json)
          wget "$URL" -O narrow.zip
          unzip -q narrow.zip
          cd ..

      - name: Prepare output dir
        run: mkdir -p out/base out/nl out/nr

      - name: Batch build all weights
        run: |
          for ttf in ./ioskeley/*.ttf; do
            [ -f "$ttf" ] || continue
            fn=$(basename "$ttf")
            suffix=${fn#IoskeleyMonoNerdFont-}
            fontforge -script fuse_fonts.ff "$ttf" ./maple/ttf/MapleMono-CN-${suffix} ./out/base/IoskeleyMapleMono-${suffix}
            fontforge -script fuse_fonts.ff "$ttf" ./maple/ttf/MapleMono-CN-Narrow-${suffix} ./out/nr/IoskeleyMapleMono-NR-${suffix}
          done

      - name: Generate No-Ligatures NL
        run: python3 strip_ligas.py ./out/base ./out/nl

      - name: Package
        run: zip -r IoskeleyMapleMono.zip out

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: font-artifact
          path: IoskeleyMapleMono.zip
