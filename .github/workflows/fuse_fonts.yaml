name: Build IoskeleyMapleMono
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y fontforge python3 jq unzip curl

      - name: Download IoskeleyMono‑NerdFont
        run: |
          mkdir -p ioskeley
          cd ioskeley
          curl -s https://api.github.com/repos/ahatem/IoskeleyMono/releases/latest > meta.json
          # 严格匹配截图里的文件名！大写 I
          URL=$(jq -r '.assets[] | select(.name == "IoskeleyMono-NerdFont.zip") | .browser_download_url' meta.json)
          echo "Download url: $URL"
          wget "$URL" -O ioskeley.zip
          unzip -q ioskeley.zip
          echo "=== Ioskeley extracted files ==="
          find . -name "*.ttf"

      - name: Download Maple‑Mono‑CN
        run: |
          mkdir -p maple
          cd maple
          curl -s https://api.github.com/repos/subframe7536/maple-font/releases/latest > meta.json
          URL=$(jq -r '.assets[] | select(.name=="MapleMono-CN.zip") | .browser_download_url' meta.json)
          wget "$URL" -O maple.zip
          unzip -q maple.zip
          echo "=== Maple‑CN extracted files ==="
          find . -name "*.ttf"

      - name: Download Maple‑Mono‑CN‑Narrow
        run: |
          cd maple
          curl -s https://api.github.com/repos/subframe7536/maple-font/releases/latest > meta.json
          URL=$(jq -r '.assets[] | select(.name=="MapleMono-CN-Narrow.zip") | .browser_download_url' meta.json)
          wget "$URL" -O narrow.zip
          unzip -q narrow.zip
          cd ..

      - name: Prepare output folders
        run: mkdir -p out/base out/nl out/nr

      - name: Build single test‑font (Regular)
        run: |
          fontforge -script fuse_fonts.ff \
            ./ioskeley/IoskeleyMonoNerdFont-Regular.ttf \
            ./maple/ttf/MapleMono-CN-Regular.ttf \
            ./out/base/IoskeleyMapleMono-Regular.ttf

      - name: Generate No‑Ligatures (NL)
        run: python3 strip_ligas.py ./out/base ./out/nl

      - name: Package zip
        run: zip -r IoskeleyMapleMono.zip out

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: font‑artifact
          path: IoskeleyMapleMono.zip
